services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: outreach_dev_password
      POSTGRES_DB: outreach_crm
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U outreach -d outreach_crm']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
